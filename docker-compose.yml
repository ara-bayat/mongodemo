services:
  mongo:
    image: mongo:8.3.8
    container_name: mongo-learning
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: "Aa@12345"

  mongo-express:
    image: mongo-express
    container_name: mongo-express-learning
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: "Aa@12345"
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: "Aa@12345"
      ME_CONFIG_MONGODB_URL: "mongodb://admin:Aa%4012345@mongo:27017/"
    depends_on:
      - mongo

volumes:
  mongo-data: